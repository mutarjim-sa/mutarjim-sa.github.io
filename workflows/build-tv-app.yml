name: Build TV app

# يبني تطبيق «مترجم TV» (APK) لتلفزيونات Google TV / Android TV
# وينشره في إصدار ثابت اسمه tv-latest، وصفحة live.html تربط عليه مباشرة
on:
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/build-tv-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Site URL
        id: site
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            URL="https://$OWNER.github.io/live.html"
          else
            URL="https://$OWNER.github.io/$REPO/live.html"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Site: $URL"

      - name: Build APK
        run: gradle -p tv-app assembleDebug -PsiteUrl="${{ steps.site.outputs.url }}" --no-daemon

      - name: Rename
        run: cp tv-app/app/build/outputs/apk/debug/app-debug.apk mutarjim-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mutarjim-tv
          path: mutarjim-tv.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: مترجم TV
          body: تطبيق التلفزيون لـ Google TV / Android TV. حمّله من موقع مترجم (المترجم المباشر).
          files: mutarjim-tv.apk
          make_latest: false
