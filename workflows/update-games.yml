name: Auto Update Games

on:
  push:
    paths:
      - 'games/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update-games script
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\update-games.ps1

      - name: Commit and push changes if data.js changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data.js from games folder" && git push)
